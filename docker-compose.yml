services:
  gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "${GW_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg2://gongxue:${DB_PASSWORD:?请在.env设置DB_PASSWORD}@postgres:5432/gongxue
      JWT_SECRET: ${JWT_SECRET:?请在.env设置JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-治理管理员}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BYOK_MASTER_KEY: ${BYOK_MASTER_KEY:-}
      LLM_ENABLED: ${LLM_ENABLED:-false}
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gongxue
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在.env设置DB_PASSWORD}
      POSTGRES_DB: gongxue
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gongxue -d gongxue"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
